use_default_settings: true
server:
  secret_key: "antigravity_secret_key_123"
  bind_address: "0.0.0.0"
  limiter: false

search:
  safe_search: 0
  autocomplete: ""
  request_timeout: 5.0
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  proxies:
    http:
      - http://username:password@proxy_ip:port
    https:
      - http://username:password@proxy_ip:port

engines:
  - name: yandex
    engine: yandex
    shortcut: yx
    timeout: 3.5
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    timeout: 3.5
    disabled: false

  - name: google
    engine: google
    shortcut: g
    timeout: 3.5
    disabled: false

  - name: duckduckgo
    disabled: true

  - name: qwant
    disabled: true

  - name: startpage
    disabled: true

  - name: yahoo
    disabled: true

  - name: mojeek
    disabled: true

  - name: seznam
    disabled: true

  - name: brave
    disabled: true

  - name: google cse
    disabled: true

  - name: wikipedia
    disabled: true

use_default_settings: true
server:
  secret_key: "antigravity_secret_key_123"
  bind_address: "0.0.0.0"

search:
  safe_search: 0
  autocomplete: ""
  request_timeout: 4.0
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    timeout: 3.0
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    timeout: 3.0
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    timeout: 3.0
    disabled: false

  - name: qwant
    engine: qwant
    shortcut: qw
    timeout: 3.0
    disabled: false

  - name: startpage
    engine: startpage
    shortcut: sp
    timeout: 3.0
    disabled: false

  - name: brave
    disabled: true

  - name: google cse
    disabled: true

  - name: wikipedia
    disabled: true

use_default_settings: true
server:
  secret_key: "antigravity_secret_key_123"
  bind_address: "0.0.0.0"
  limiter: false

search:
  safe_search: 0
  autocomplete: ""
  request_timeout: 6.0
  formats:
    - html
    - json

outgoing:
  request_timeout: 5.0
  max_request_timeout: 8.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  - name: startpage
    engine: startpage
    shortcut: sp
    timeout: 5.0
    disabled: false

  - name: yandex
    engine: yandex
    shortcut: yx
    timeout: 5.0
    disabled: false

  - name: yahoo
    engine: yahoo
    shortcut: yh
    timeout: 5.0
    disabled: false

  - name: mojeek
    engine: mojeek
    shortcut: mj
    timeout: 5.0
    disabled: false

  - name: google
    disabled: true

  - name: bing
    disabled: true

  - name: duckduckgo
    disabled: true

  - name: qwant
    disabled: true

  - name: seznam
    disabled: true

  - name: brave
    disabled: true

  - name: google cse
    disabled: true

  - name: wikipedia
    disabled: true

  - name: wikidata
    disabled: true


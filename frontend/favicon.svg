<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e3a8a" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="18" fill="url(#logo-bg)"/>
  
  <!-- Sleek Geometric Radar/Envelope Mark -->
  <g filter="url(#subtle-shadow)">
    <!-- Email Base Outline -->
    <path d="M14 20C14 16.6863 16.6863 14 20 14H44C47.3137 14 50 16.6863 50 20V42C50 45.3137 47.3137 48 44 48H20C16.6863 48 14 45.3137 14 42V20Z" fill="none" stroke="url(#glow-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Envelope Fold Line -->
    <path d="M14 20L32 33L50 20" fill="none" stroke="url(#glow-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Identity Pulse Core / Beacon -->
    <circle cx="32" cy="33" r="5" fill="#60a5fa" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="32" cy="33" r="1.8" fill="#ffffff"/>
  </g>
</svg>
